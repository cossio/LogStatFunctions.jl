name: Dependabot auto-merge

# Auto-merges Dependabot PRs that bump GitHub Actions, which arrive as a single
# grouped PR per month. All update types are included, semver-major among them:
# every PR is gated by a required CI check, so a breaking bump fails CI and is
# never merged. Filtering majors out would instead let one major bump hold the
# entire month's group.
#
# Julia package updates are always left for manual review: widening a [compat]
# to admit a new major is the change most likely to break tests.
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Auto-merge Dependabot GitHub Actions updates
    runs-on: ubuntu-latest
    # Skips entirely for any PR not opened by Dependabot; those stay manual.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      # Note: deliberately does not check out the PR's code.
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Enable auto-merge
        if: >-
          steps.meta.outputs.package-ecosystem == 'github-actions' ||
          steps.meta.outputs.package-ecosystem == 'github_actions'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
